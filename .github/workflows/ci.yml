name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validate the post-merge state on PRs so CI catches conflicts before they land.
# Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (gulp deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx gulp deploy

      - name: Zip dist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF_NAME}
          cd dist && zip -r "../taiga-front-${TAG}.zip" . && cd ..
          echo "RELEASE_ZIP=taiga-front-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Upload dist artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: ${{ env.RELEASE_ZIP }}
          retention-days: 1

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --generate-notes \
            "taiga-front-${TAG}.zip"

  # ── Docker image → GHCR ───────────────────────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            TAIGA_NAKOMIS_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/nakomis/taiga-front:${{ github.ref_name }}
            ghcr.io/nakomis/taiga-front:latest

  # ── CI status gate ────────────────────────────────────────────────────────────
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ CI passed"
